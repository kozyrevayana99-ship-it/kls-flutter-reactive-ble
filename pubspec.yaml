name: flutter_reactive_ble
description: KLS modified Reactive Bluetooth Low Energy plugin.
version: 5.4.1
homepage: https://github.com/kozyrevayana99-ship-it/kls-flutter-reactive-ble

environment:
  sdk: ">=3.7.0 <4.0.0"
  flutter: ">=3.29.0"

flutter:
  plugin:
    platforms:
      android:
        default_package: reactive_ble_mobile
      ios:
        default_package: reactive_ble_mobile

dependencies:
  collection: ^1.15.0
  flutter:
    sdk: flutter
  functional_data: ^1.0.0
  meta: ^1.3.0

  reactive_ble_mobile:
    git:
      url: https://github.com/kozyrevayana99-ship-it/kls-reactive-ble-mobile.git
      ref: main

  reactive_ble_platform_interface: 5.4.1

dev_dependencies:
  build_runner: ^2.3.3
  flutter_lints: ^1.0.4
  flutter_test:
    sdk: flutter
  functional_data_generator: ^1.1.2
  mockito: ^5.0.14
